services:
  - type: web
    name: multi-agent-build
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --ignore-scripts
    startCommand: npm run service
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: WORKFLOW_STATE_BACKEND
        value: file
      - key: WORKFLOW_STATE_DIR
        value: /tmp/multi-agent-runs
      - key: AUDIT_LOG_DIR
        value: /tmp/multi-agent-runs/audit
      - key: REQUIRE_DURABLE_STATE
        value: "false"
      # Production durable mode: attach a persistent disk at /var/data, then set
      # WORKFLOW_STATE_DIR=/var/data/multi-agent-runs,
      # AUDIT_LOG_DIR=/var/data/multi-agent-runs/audit,
      # DURABLE_STATE_MOUNT=/var/data, and REQUIRE_DURABLE_STATE=true.
      - key: DURABLE_STATE_MOUNT
        sync: false
      - key: MAX_REPAIR_ATTEMPTS
        value: "2"
      - key: MAX_REQUEST_BYTES
        value: "1048576"
      - key: RATE_LIMIT_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_CLIENTS
        value: "10000"
      - key: SERVICE_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TARGET_REPOSITORY
        sync: false
      - key: TARGET_BRANCH
        value: feature/agent-build
      - key: TARGET_BASE
        value: main
      - key: AGENT_PROVIDER_URL
        sync: false
      - key: AGENT_PROVIDER_API_KEY
        sync: false
      - key: AGENT_PROVIDER_TIMEOUT_MS
        value: "30000"
      - key: AGENT_PROVIDER_MAX_RESPONSE_BYTES
        value: "1048576"
      - key: AGENT_PROVIDER_ALLOWED_HOSTS
        sync: false
